<div class="min-h-screen bg-gray-100 p-3">
  <h4 class="uppercase bg-teal-600 rounded-lg p-2">Danh mục chức vụ</h4>
  <div class="container-fluid bg-white p-0 shadow-sm rounded-lg">
    <div class="flex items-center justify-end border-b px-4 pt-3 pb-3">
    </div>
    <table class="table table-striped table-hover">
      <thead>
        <tr>
          <th class="font-medium text-center">Mã chức vụ</th>
          <th class="font-medium text-center">Tên chức vụ</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let chucVu of pagedChucVu; let i = index">
          <td class="text-center">{{ chucVu.maChucVu }}</td>
          <td class="text-center">{{ chucVu.tenChucVu }}</td>
        </tr>
      </tbody>
    </table>

    <mat-paginator
      *ngIf="total > 0"
      [length]="total"
      [pageIndex]="pageIndex"
      [pageSize]="pageSize"
      [pageSizeOptions]="pageSizeOptions"
      (page)="onPageChange($event)"
      aria-label="Chọn trang chức vụ"
    ></mat-paginator>
  </div>
</div>
