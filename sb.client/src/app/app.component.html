<div class="app-root flex h-screen overflow-hidden">
  <app-loading *ngIf="loading$ | async"></app-loading>
  <app-sidebar *ngIf="showSidebar"></app-sidebar>

  <!-- Cột bên phải sidebar: navbar ở trên, nội dung ở dưới -->
  <div class="flex flex-col flex-1 min-w-0 h-screen">
    <app-navbar *ngIf="showNavbar && (authService.currentUser | async)"></app-navbar>
    <main class="flex-1 overflow-auto">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
