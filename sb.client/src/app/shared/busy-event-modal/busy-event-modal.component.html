<ng-container *ngIf="visible">
  <div class="modal fade show d-block" tabindex="-1" (click)="closeModal.emit()">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header py-2.5">
          <h6 class="modal-title fw-bold">
            <i class="fa-solid fa-calendar-minus text-secondary me-2"></i>{{ title }}
          </h6>
          <button type="button" class="btn-close" (click)="closeModal.emit()" [disabled]="saving"></button>
        </div>

        <div class="modal-body small">
          <div class="row g-2 mb-2">
            <div class="col-4">
              <label class="form-label fw-semibold mb-1">Loại sự kiện</label>
              <select class="form-select form-select-sm" [(ngModel)]="loai" (ngModelChange)="onLoaiChange()">
                <option [ngValue]="1">Họp</option>
                <option [ngValue]="2">Công tác</option>
                <option [ngValue]="3">Nghỉ phép</option>
                <option [ngValue]="4">Khác</option>
              </select>
            </div>
            <div class="col-8">
              <label class="form-label fw-semibold mb-1">Tiêu đề <span class="text-danger">*</span></label>
              <input type="text" class="form-control form-control-sm" [(ngModel)]="tieuDe" [placeholder]="tieuDePlaceholder" />
            </div>
          </div>

          <div class="alert alert-danger py-2 px-2.5 small mb-2 d-flex align-items-start gap-2" *ngIf="loai === 3">
            <i class="fa-solid fa-calendar-xmark mt-0.5 flex-shrink-0"></i>
            <div>
              Lịch nghỉ phép sẽ được hiển thị nổi bật trên lịch của cả <b>Lãnh đạo</b> và <b>Trợ lý</b> để tránh xếp lịch trình vào ngày nghỉ.
            </div>
          </div>

          <div class="row g-2 mb-2">
            <div [ngClass]="caNgay ? 'col-6' : 'col-5'">
              <label class="form-label fw-semibold mb-1">{{ caNgay ? 'Từ ngày' : 'Ngày' }} <span class="text-danger">*</span></label>
              <app-vn-date-input [(ngModel)]="ngay" (ngModelChange)="onNgayChange()"></app-vn-date-input>
            </div>
            <div class="col-6" *ngIf="caNgay">
              <label class="form-label fw-semibold mb-1">Đến ngày <span class="text-danger">*</span></label>
              <app-vn-date-input [(ngModel)]="denNgay"></app-vn-date-input>
            </div>
            <div class="col-3" *ngIf="!caNgay">
              <label class="form-label fw-semibold mb-1">Từ</label>
              <input type="time" class="form-control form-control-sm" [(ngModel)]="gioBatDau" />
            </div>
            <div class="col-4" *ngIf="!caNgay">
              <label class="form-label fw-semibold mb-1">Đến</label>
              <input type="time" class="form-control form-control-sm" [(ngModel)]="gioKetThuc" />
            </div>
          </div>

          <div class="text-danger small mb-2" *ngIf="isTimeRangeInvalid">
            <i class="fa-solid fa-circle-exclamation me-1"></i>
            {{ caNgay ? 'Ngày kết thúc phải lớn hơn hoặc bằng ngày bắt đầu.' : 'Giờ kết thúc phải lớn hơn giờ bắt đầu.' }}
          </div>

          <div class="d-flex gap-3 mb-2">
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="chkCaNgay" [(ngModel)]="caNgay" />
              <label class="form-check-label" for="chkCaNgay">Cả ngày</label>
            </div>
            <div class="form-check form-switch">
              <input class="form-check-input" type="checkbox" id="chkRiengTu" [(ngModel)]="laRiengTu" />
              <label class="form-check-label" for="chkRiengTu">Sự kiện riêng tư</label>
            </div>
          </div>

          <div>
            <label class="form-label fw-semibold mb-1">Ghi chú</label>
            <textarea class="form-control form-control-sm" rows="2" [(ngModel)]="ghiChu" placeholder="Ghi chú thêm..."></textarea>
          </div>
        </div>

        <div class="modal-footer py-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" (click)="closeModal.emit()" [disabled]="saving">Đóng</button>
          <button type="button" class="btn btn-sm btn-primary" (click)="submit()" [disabled]="saving || !tieuDe.trim() || isTimeRangeInvalid">
            <span class="spinner-border spinner-border-sm me-1" *ngIf="saving"></span>
            <i class="fa-solid fa-plus me-1" *ngIf="!saving"></i>Lưu sự kiện
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
</ng-container>
