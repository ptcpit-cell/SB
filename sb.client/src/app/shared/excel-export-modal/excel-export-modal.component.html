<ng-container *ngIf="visible">
  <div class="modal fade show d-block" tabindex="-1" (click)="!exporting && closeModal.emit()">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content">
        <div class="modal-header py-2.5 bg-light">
          <h6 class="modal-title fw-bold mb-0">
            <i class="fa-solid fa-file-excel text-success me-2"></i>Xuất báo cáo Excel
          </h6>
          <button type="button" class="btn-close" (click)="closeModal.emit()" [disabled]="exporting"></button>
        </div>

        <div class="modal-body small">
          <div class="mb-3">
            <label class="form-label fw-semibold mb-1">Khoảng thời gian <span class="text-danger">*</span></label>
            <div class="row g-2">
              <div class="col-6">
                <label class="form-label text-secondary mb-0.5" style="font-size: 0.75rem">Từ ngày</label>
                <app-vn-date-input [(ngModel)]="tuNgay" [max]="denNgay"></app-vn-date-input>
              </div>
              <div class="col-6">
                <label class="form-label text-secondary mb-0.5" style="font-size: 0.75rem">Đến ngày</label>
                <app-vn-date-input [(ngModel)]="denNgay" [min]="tuNgay"></app-vn-date-input>
              </div>
            </div>
            <div class="d-flex flex-wrap gap-1 mt-2">
              <span class="text-secondary align-self-center me-1" style="font-size: 0.75rem">Chọn nhanh:</span>
              <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" (click)="chonNhanh('today')">Hôm nay</button>
              <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" (click)="chonNhanh('week')">Tuần này</button>
              <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" (click)="chonNhanh('month')">Tháng này</button>
              <button type="button" class="btn btn-outline-secondary btn-sm py-0 px-2" (click)="chonNhanh('30days')">30 ngày qua</button>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label fw-semibold mb-1">Chi nhánh</label>
            <select class="form-select form-select-sm" [(ngModel)]="chiNhanhId" [disabled]="loadingBranches">
              <option [ngValue]="0">Tất cả chi nhánh</option>
              <option *ngFor="let cn of chiNhanhs" [ngValue]="cn.chiNhanhId">
                {{ cn.maChiNhanh }} - {{ cn.tenChiNhanh }}
              </option>
            </select>
            <div class="form-text">Mặc định chọn sẵn chi nhánh hiện tại của tài khoản đang đăng nhập.</div>
          </div>

          <div class="mb-1">
            <label class="form-label fw-semibold mb-1">Phạm vi trạng thái</label>
            <select class="form-select form-select-sm" [(ngModel)]="nhomTrangThai">
              <option [ngValue]="0">Tất cả yêu cầu</option>
              <option [ngValue]="1">Chỉ yêu cầu đang xử lý</option>
              <option [ngValue]="2">Chỉ yêu cầu đã trình / hoàn thành</option>
            </select>
          </div>
        </div>

        <div class="modal-footer py-2">
          <button type="button" class="btn btn-sm btn-outline-secondary" (click)="closeModal.emit()" [disabled]="exporting">Đóng</button>
          <button type="button" class="btn btn-sm btn-success fw-medium" (click)="exportExcel()" [disabled]="exporting">
            <span class="spinner-border spinner-border-sm me-1" *ngIf="exporting"></span>
            <i class="fa-solid fa-download me-1" *ngIf="!exporting"></i>
            {{ exporting ? 'Đang xuất...' : 'Tải file Excel (.xlsx)' }}
          </button>
        </div>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
</ng-container>
