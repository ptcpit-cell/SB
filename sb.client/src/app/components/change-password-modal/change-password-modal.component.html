<ng-container *ngIf="visible">
  <div class="modal fade show d-block" tabindex="-1" (click)="!submitting && closeModal.emit()">
    <div class="modal-dialog modal-dialog-centered" (click)="$event.stopPropagation()">
      <div class="modal-content border-0 shadow-lg">
        <div class="modal-header py-3 border-bottom">
          <div class="d-flex align-items-center gap-2">
            <span class="cp-icon-wrap d-inline-flex align-items-center justify-content-center rounded-2">
              <i class="fa-solid fa-key text-primary"></i>
            </span>
            <div>
              <h6 class="modal-title fw-bold mb-0">Thay đổi mật khẩu</h6>
              <div class="text-secondary small">Hệ thống sẽ tự động cập nhật phiên đăng nhập mới sau khi lưu</div>
            </div>
          </div>
          <button type="button" class="btn-close" (click)="closeModal.emit()" [disabled]="submitting"></button>
        </div>

        <form (ngSubmit)="onSubmit()">
          <div class="modal-body p-4">
            <div *ngIf="errorMessage" class="alert alert-danger py-2 px-3 small mb-3 d-flex align-items-center gap-2">
              <i class="fa-solid fa-circle-exclamation"></i>
              <span>{{ errorMessage }}</span>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark mb-1">
                Mật khẩu hiện tại <span class="text-danger">*</span>
              </label>
              <div class="input-group input-group-sm">
                <input
                  [type]="showOld ? 'text' : 'password'"
                  class="form-control"
                  name="oldPassword"
                  [(ngModel)]="oldPassword"
                  autocomplete="current-password"
                  placeholder="Nhập mật khẩu hiện tại..."
                  [disabled]="submitting"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="showOld = !showOld"
                  tabindex="-1"
                >
                  <i class="fa-regular" [ngClass]="showOld ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
              </div>
            </div>

            <div class="mb-3">
              <label class="form-label small fw-semibold text-dark mb-1">
                Mật khẩu mới <span class="text-danger">*</span>
              </label>
              <div class="input-group input-group-sm">
                <input
                  [type]="showNew ? 'text' : 'password'"
                  class="form-control"
                  name="newPassword"
                  [(ngModel)]="newPassword"
                  autocomplete="new-password"
                  placeholder="Tối thiểu 4 ký tự..."
                  [disabled]="submitting"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="showNew = !showNew"
                  tabindex="-1"
                >
                  <i class="fa-regular" [ngClass]="showNew ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
              </div>
            </div>

            <div class="mb-1">
              <label class="form-label small fw-semibold text-dark mb-1">
                Xác nhận mật khẩu mới <span class="text-danger">*</span>
              </label>
              <div class="input-group input-group-sm">
                <input
                  [type]="showConfirm ? 'text' : 'password'"
                  class="form-control"
                  name="confirmPassword"
                  [(ngModel)]="confirmPassword"
                  autocomplete="new-password"
                  placeholder="Nhập lại mật khẩu mới..."
                  [disabled]="submitting"
                />
                <button
                  type="button"
                  class="btn btn-outline-secondary"
                  (click)="showConfirm = !showConfirm"
                  tabindex="-1"
                >
                  <i class="fa-regular" [ngClass]="showConfirm ? 'fa-eye-slash' : 'fa-eye'"></i>
                </button>
              </div>
            </div>
          </div>

          <div class="modal-footer py-2.5 bg-light border-top">
            <button type="button" class="btn btn-sm btn-outline-secondary" (click)="closeModal.emit()" [disabled]="submitting">
              Hủy
            </button>
            <button type="submit" class="btn btn-sm btn-primary px-3" [disabled]="submitting">
              <span class="spinner-border spinner-border-sm me-1" *ngIf="submitting"></span>
              <i class="fa-solid fa-check me-1" *ngIf="!submitting"></i>
              Lưu mật khẩu mới
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
  <div class="modal-backdrop fade show"></div>
</ng-container>
